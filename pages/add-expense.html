<!DOCTYPE html>
<html lang="ur">

<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/cards.css">
</head>

<body>

    <div class="header-box">
        <div class="logo-text">Expense Tracker</div>
        <div class="nav-links">
            <a href="../index.html" class="nav-item">Home</a>
            <a href="add-expense.html" class="nav-item">Add Expense</a>
            <a href="history.html" class="nav-item">History</a>
            <a href="about.html" class="nav-item">About</a>
        </div>
    </div>

    <div class="main-wrapper">
        <h1>Add New Expense</h1>

        <div class="form-box">

            <div class="input-group">
                Date
                <input id="date" type="date">
            </div>

            <div class="input-group2">
                Category
                <select id="Category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
            </div>

            <div class="input-group2">
                Amount (Rs.)
                <input id="Amount" type="number" placeholder="0">
            </div>

            <div class="input-group2">
                Note
                <input id="Note" type="text" placeholder="Optional note">
            </div>

            <button class="btn-primary" type="submit" id="submit">Save Expense</button>

        </div>
    </div>

    <div class="footer-box">
        <p>Edited with Saad - Expense Tracker 2026</p>
    </div>
    <script src="app.js"></script>

</body>

</html>
