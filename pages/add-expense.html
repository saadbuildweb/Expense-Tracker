<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Add Kharcha</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/cards.css">
</head>
<body>

  <div class="header-box" style="background-color:#2c3e50; padding:20px; color:white;">
    <div class="logo-text" style="font-size:24px; font-weight:bold;">Kharcha Tracker</div>
    <div class="nav-links">
      <a href="../index.html" class="nav-item">Home</a>
      <a href="add-expense.html" class="nav-item">Add Kharcha</a>
      <a href="history.html" class="nav-item">History</a>
      <a href="about.html" class="nav-item">About</a>
    </div>
  </div>

  <div class="main-wrapper">
    <h1 style="text-align:center; color:#2c3e50; margin-top:30px;">Naya Kharcha Add Karein</h1>

    <div class="form-box" style="max-width:500px; margin:30px auto; background:#ecf0f1; padding:25px; border-radius:8px;">

      <div class="input-group" style="margin-bottom:15px;">
        Date
        <input type="date" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <div class="input-group2" style="margin-bottom:15px;">
        Category
        <select style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
      </div>

      <div class="input-group" style="margin-bottom:15px;">
        Amount (Rs.)
        <input type="number" placeholder="0" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <div class="input-group2" style="margin-bottom:15px;">
        Note
        <input type="text" placeholder="Optional note" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <button class="btn-primary" style="width:100%; padding:12px; margin-top:10px;">Save Kharcha</button>

    </div>
  </div>

  <div class="footer-box" style="background-color:#2c3e50; color:white; text-align:center; padding:15px; margin-top:50px;">
    <p>Made with love - Kharcha Tracker 2026</p>
  </div>

</body>
</html>
