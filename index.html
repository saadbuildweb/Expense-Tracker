<!DOCTYPE html>
<html lang="ur">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/cards.css">
</head>

<body>

    <div class="header-box">
        <div class="logo-text">Expense Tracker</div>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Home</a>
            <a href="add-expense.html" class="nav-item">Add Expense</a>
            <a href="history.html" class="nav-item">History</a>
            <a href="about.html" class="nav-item">About</a>
        </div>
    </div>

    <div class="main-wrapper">
        <h1>Welcome to your Expense Dashboard</h1>
        <p class="sub-text">Track your daily Expense</p>
        <div class="cards-row">
            <div class="summary-card">
                <h3>Total Expense</h3>
                <p class="big-number" id="TotalExpense">Rs. 0</p>
            </div>

            <div class="summary-card">
                <h3>This Month</h3>
                <p class="big-number2" id="MonthExpense">Rs. 0</p>
            </div>

            <div class="summary-card">
                <h3>Total Entries</h3>
                <p class="big-number3" id="Entries">0</p>
            </div>
        </div>

        <div class="cta-box">
            <a href="add-expense.html"><button class="btn-primary">+ Add New Expense</button></a>
            <a href="history.html"><button class="btn1">View History</button></a>
            <button id="logout-btn" class="btn1">Logout</button>
        </div>

        <div class="recent-section">
            <h2>Recent Expenses</h2>
            <table class="expense-table">
                <thead>
                    <td>Date</td>
                    <td>Category</td>
                    <td>Amount</td>
                    <td>Note</td>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <div class="footer-box">
        <p>Edited by Saad - Expense Tracker 2026</p>
    </div>
    <script src="js/index.js"></script>

</body>

</html>
