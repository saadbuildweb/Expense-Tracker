<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Kharcha Tracker - Home</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>

  <div class="header-box" style="background-color:#2c3e50; padding:20px; color:white;">
    <div class="logo-text" style="font-size:24px; font-weight:bold;">Kharcha Tracker</div>
    <div class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="pages/add-expense.html" class="nav-item">Add Kharcha</a>
      <a href="pages/history.html" class="nav-item">History</a>
      <a href="pages/about.html" class="nav-item">About</a>
    </div>
  </div>

  <div class="main-wrapper">
    <h1 style="text-align:center; color:#2c3e50; margin-top:30px;">Welcome to your Kharcha Dashboard</h1>
    <p class="sub-text" style="text-align:center; color:gray;">Apna roz ka kharcha yahan track karein</p>

    <div class="cards-row">
      <div class="summary-card" style="background:#ecf0f1; padding:20px; border-radius:8px; margin:10px;">
        <h3>Total Kharcha</h3>
        <p class="big-number" style="font-size:28px; color:#e74c3c;">Rs. 0</p>
      </div>

      <div class="summary-card2" style="background: #ecf0f1; padding: 20px; border-radius: 8px; margin: 10px;">
        <h3>This Month</h3>
        <p class="big-number2" style="font-size: 28px; color: #27ae60;">Rs. 0</p>
      </div>

      <div class="card-summary-3" style="background:#ecf0f1;padding:20px;border-radius:8px;margin:10px;">
        <h3>Total Entries</h3>
        <p style="font-size:28px;color:#2980b9;">0</p>
      </div>
    </div>

    <div class="cta-box" style="text-align:center; margin-top:40px;">
      <a href="pages/add-expense.html"><button class="btn-primary">+ Add New Kharcha</button></a>
      <a href="pages/history.html"><button class="btn1">View History</button></a>
    </div>

    <div class="recent-section">
      <h2 style="color:#2c3e50; margin-top:50px;">Recent Kharche</h2>
      <table class="expense-table" border="1" style="width:100%; border-collapse:collapse; margin-top:15px;">
        <tr style="background:#2c3e50; color:white;">
          <td style="padding:10px;">Date</td>
          <td style="padding:10px;">Category</td>
          <td style="padding:10px;">Amount</td>
          <td style="padding:10px;">Note</td>
        </tr>
        <tr>
          <td style="padding:10px;">No data yet</td>
          <td style="padding:10px;">-</td>
          <td style="padding:10px;">-</td>
          <td style="padding:10px;">-</td>
        </tr>
      </table>
    </div>
  </div>

  <div class="footer-box" style="background-color:#2c3e50; color:white; text-align:center; padding:15px; margin-top:50px;">
    <p>Made with love - Kharcha Tracker 2026</p>
  </div>

</body>
</html>
